<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preposto RPA — VOX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
  <style>
    /* ── VOX brand tokens ───────────────────────────────────────────────────── */
    :root {
      --vox-primary:   #be6732;   /* laranja VOX */
      --vox-primary-d: #9e5228;   /* hover / sombra */
      --vox-ink:       #1e1f1f;   /* preto VOX */
      --vox-mid:       #6f7070;   /* cinza médio */
      --vox-light:     #8b8c8c;   /* cinza claro */
      --vox-deep:      #545c59;   /* cinza-verde escuro */
      --vox-deep-d:    #3d4440;   /* hover deep */
      --bg:            #f5f0ec;   /* off-white quente */
      --surface:       #ffffff;
      --border:        #e2ddd8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--vox-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(30,31,31,.10);
      width: 100%;
      max-width: 760px;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .card-header {
      background: var(--vox-ink);
      color: #fff;
      padding: 0;
      display: flex;
      align-items: stretch;
    }
    .header-accent {
      width: 6px;
      background: var(--vox-primary);
      flex-shrink: 0;
    }
    .header-content {
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .vox-badge { display: flex; align-items: center; }
    .header-divider {
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,.18);
    }
    .header-text h1 { font-size: 1rem; font-weight: 600; color: #fff; }
    .header-text p  { font-size: .78rem; color: var(--vox-light); margin-top: 3px; }

    .card-body { padding: 32px; display: flex; flex-direction: column; gap: 24px; }

    /* ── Upload zone ─────────────────────────────────────────────────────────── */
    .upload-zone {
      border: 2px dashed #ccc5bb;
      border-radius: 8px;
      padding: 36px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--vox-primary);
      background: #fdf6f0;
    }
    .upload-zone svg { width: 38px; height: 38px; color: var(--vox-primary); margin-bottom: 10px; }
    .upload-zone p   { font-size: .9rem; color: var(--vox-mid); }
    .upload-zone strong { display: block; font-size: 1rem; color: var(--vox-ink); margin-bottom: 4px; }
    #file-input { display: none; }

    /* ── Preview ─────────────────────────────────────────────────────────────── */
    #preview { display: none; }
    .preview-info {
      background: #fdf6f0;
      border: 1px solid #e0c5a8;
      border-left: 4px solid var(--vox-primary);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: .875rem;
      color: var(--vox-primary-d);
    }
    .preview-info strong { display: block; margin-bottom: 6px; color: var(--vox-ink); }
    .preview-list { list-style: none; padding: 0; margin-top: 6px; }
    .preview-list li { padding: 2px 0; color: var(--vox-mid); font-size: .82rem; }
    .preview-list li::before { content: "→ "; color: var(--vox-primary); }

    /* ── Buttons ─────────────────────────────────────────────────────────────── */
    .btn-row { display: flex; gap: 12px; }
    button {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:disabled { opacity: .40; cursor: not-allowed; }

    #btn-execute {
      background: var(--vox-primary);
      color: #fff;
      flex: 1;
    }
    #btn-execute:not(:disabled):hover { background: var(--vox-primary-d); }

    #btn-reset {
      background: var(--border);
      color: var(--vox-deep);
    }
    #btn-reset:hover { background: #d5cfc8; }

    /* ── Log area ────────────────────────────────────────────────────────────── */
    #log-section { display: none; }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .log-header span { font-weight: 600; font-size: .9rem; color: var(--vox-ink); }
    .progress-text   { font-size: .8rem; color: var(--vox-mid); }

    #log-box {
      background: #161412;
      color: #d4ccc4;
      border-radius: 8px;
      padding: 16px;
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: .8rem;
      line-height: 1.6;
      height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #log-box .ok    { color: #7ecf6e; }
    #log-box .error { color: #f07070; }
    #log-box .warn  { color: #e0a550; }
    #log-box .info  { color: #f0a06a; }
    #log-box .done  { color: #be6732; font-weight: bold; }

    /* ── Controls during run ─────────────────────────────────────────────────── */
    #run-controls { display: none; gap: 8px; }
    #btn-pause {
      background: var(--vox-primary);
      color: #fff;
      flex: 1;
      padding: 10px;
    }
    #btn-pause:hover { background: var(--vox-primary-d); }
    #btn-pause.paused { background: var(--vox-deep); }
    #btn-pause.paused:hover { background: var(--vox-deep-d); }
    #btn-partial {
      background: var(--vox-mid);
      color: #fff;
      flex: 1;
      padding: 10px;
    }
    #btn-partial:hover { background: #585959; }

    /* ── Download ────────────────────────────────────────────────────────────── */
    #download-section { display: none; }
    #btn-download {
      background: var(--vox-deep);
      color: #fff;
      width: 100%;
      padding: 12px;
    }
    #btn-download:hover { background: var(--vox-deep-d); }

    /* ── Progress bar ────────────────────────────────────────────────────────── */
    .progress-bar-wrap {
      background: var(--border);
      border-radius: 4px;
      height: 5px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--vox-primary);
      width: 0%;
      transition: width .4s ease;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="header-accent"></div>
    <div class="header-content">
      <span class="vox-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 38" height="34" aria-label="VOX">
          <defs>
            <linearGradient id="vg" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%"   stop-color="#a85528"/>
              <stop offset="55%"  stop-color="#be6732"/>
              <stop offset="100%" stop-color="#cc7840"/>
            </linearGradient>
          </defs>
          <text font-family="'Nunito', 'Varela Round', Arial Rounded MT Bold, sans-serif"
                font-weight="800" font-size="36"
                fill="url(#vg)"
                x="0" y="34" letter-spacing="-1">VOX</text>
        </svg>
      </span>
      <div class="header-divider"></div>
      <div class="header-text">
        <h1>Preposto RPA</h1>
        <p>Indicação automática de prepostos — Elaw Carrefour</p>
      </div>
    </div>
  </div>

  <div class="card-body">

    <!-- Step 1: Upload -->
    <div>
      <div class="upload-zone" id="upload-zone">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
        <strong>Clique ou arraste a planilha aqui</strong>
        <p>Formato esperado: <code>numero_processo · nome_preposto · cpf · email</code></p>
      </div>
      <input type="file" id="file-input" accept=".xlsx" />
    </div>

    <!-- Preview -->
    <div id="preview">
      <div class="preview-info">
        <strong id="preview-title"></strong>
        <ul class="preview-list" id="preview-list"></ul>
      </div>
    </div>

    <!-- Actions -->
    <div class="btn-row">
      <button id="btn-execute" disabled>Executar</button>
      <button id="btn-reset" type="button">Limpar</button>
    </div>

    <!-- Log -->
    <div id="log-section">
      <div class="log-header">
        <span>Log de execução</span>
        <span class="progress-text" id="progress-text"></span>
      </div>
      <div class="progress-bar-wrap" id="progress-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div id="log-box"></div>
    </div>

    <!-- Controls during run -->
    <div id="run-controls" style="display:none; gap:8px;" class="btn-row">
      <button id="btn-pause" type="button">⏸ Pausar</button>
      <button id="btn-partial" type="button">📥 Baixar Parcial</button>
    </div>

    <!-- Download -->
    <div id="download-section">
      <button id="btn-download" type="button">⬇ Baixar Relatório Final</button>
    </div>

  </div>
</div>

<script>
  const uploadZone = document.getElementById("upload-zone");
  const fileInput  = document.getElementById("file-input");
  const preview    = document.getElementById("preview");
  const previewTitle = document.getElementById("preview-title");
  const previewList  = document.getElementById("preview-list");
  const btnExecute = document.getElementById("btn-execute");
  const btnReset   = document.getElementById("btn-reset");
  const logSection = document.getElementById("log-section");
  const logBox     = document.getElementById("log-box");
  const progressText = document.getElementById("progress-text");
  const progressWrap = document.getElementById("progress-wrap");
  const progressFill = document.getElementById("progress-fill");
  const downloadSection = document.getElementById("download-section");
  const btnDownload  = document.getElementById("btn-download");
  const runControls  = document.getElementById("run-controls");
  const btnPause     = document.getElementById("btn-pause");
  const btnPartial   = document.getElementById("btn-partial");

  let total = 0, done = 0, evtSource = null, isPaused = false, sseRunning = false;

  // ── Upload ────────────────────────────────────────────────────────────────
  uploadZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) uploadFile(fileInput.files[0]);
  });

  uploadZone.addEventListener("dragover", e => { e.preventDefault(); uploadZone.classList.add("drag"); });
  uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("drag"));
  uploadZone.addEventListener("drop", e => {
    e.preventDefault();
    uploadZone.classList.remove("drag");
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });

  async function uploadFile(file) {
    const fd = new FormData();
    fd.append("file", file);
    try {
      const res = await fetch("/upload", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) { alert("Erro: " + (data.erro || data.error || JSON.stringify(data))); return; }

      total = data.total;
      previewTitle.textContent = `${data.total} processo(s) carregado(s) — ${file.name}`;
      previewList.innerHTML = data.preview
        .map(r => `<li>${r.processo} — ${r.nome}${r.telefone ? " · " + r.telefone : ""}</li>`)
        .join("") + (data.total > 5 ? `<li>... e mais ${data.total - 5}</li>` : "");

      preview.style.display = "block";
      btnExecute.disabled = false;
    } catch (e) {
      alert("Falha ao enviar arquivo: " + e.message);
    }
  }

  // ── Execute ───────────────────────────────────────────────────────────────
  btnExecute.addEventListener("click", async () => {
    btnExecute.disabled = true;
    btnReset.disabled   = true;
    logSection.style.display = "block";
    progressWrap.style.display = "block";
    downloadSection.style.display = "none";
    logBox.innerHTML = "";
    done = 0;
    updateProgress();

    try {
      const res = await fetch("/execute", { method: "POST" });
      const data = await res.json();
      if (!res.ok) {
        appendLog("Erro: " + (data.erro || data.error || JSON.stringify(data)), "error");
        btnExecute.disabled = false;
        btnReset.disabled   = false;
        return;
      }
      runControls.style.display = "flex";
      isPaused = false;
      btnPause.textContent = "⏸ Pausar";
      btnPause.classList.remove("paused");
      startSSE();
    } catch (e) {
      appendLog("Falha ao iniciar: " + e.message, "error");
      btnExecute.disabled = false;
      btnReset.disabled   = false;
    }
  });

  function startSSE() {
    if (evtSource) evtSource.close();
    sseRunning = true;
    evtSource = new EventSource("/logs");

    evtSource.onmessage = e => {
      const data = JSON.parse(e.data);
      if (data.heartbeat) return;
      if (data.done) {
        sseRunning = false;
        evtSource.close();
        btnReset.disabled = false;
        runControls.style.display = "none";
        downloadSection.style.display = "block";
        return;
      }
      if (data.msg) {
        appendLog(data.msg, data.status);
        if (data.status === "ok" || data.status === "error") {
          done++;
          updateProgress();
        }
      }
    };

    evtSource.onerror = () => {
      evtSource.close();
      if (!sseRunning) return;   // encerramento normal, não reconectar
      appendLog("⚠️ Conexão com o log perdida — reconectando em 4s...", "warn");
      setTimeout(() => {
        if (!sseRunning) return;
        appendLog("🔄 Reconectando ao log...", "info");
        startSSE();   // reconecta — a automação continua rodando no servidor
      }, 4000);
    };
  }

  function appendLog(msg, cls) {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = msg + "\n";
    logBox.appendChild(span);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function updateProgress() {
    if (!total) return;
    const pct = Math.round((done / total) * 100);
    progressFill.style.width = pct + "%";
    progressText.textContent = total ? `${done} / ${total}` : "";
  }

  // ── Pause / Resume ────────────────────────────────────────────────────────
  btnPause.addEventListener("click", async () => {
    isPaused = !isPaused;
    const route = isPaused ? "/pause" : "/resume";
    await fetch(route, { method: "POST" });
    btnPause.textContent = isPaused ? "▶️ Retomar" : "⏸ Pausar";
    btnPause.classList.toggle("paused", isPaused);
  });

  // ── Relatório parcial ─────────────────────────────────────────────────────
  btnPartial.addEventListener("click", () => {
    window.open("/partial-report", "_blank");
  });

  // ── Reset ─────────────────────────────────────────────────────────────────
  btnReset.addEventListener("click", () => {
    sseRunning = false;
    if (evtSource) evtSource.close();
    fileInput.value = "";
    preview.style.display   = "none";
    logSection.style.display = "none";
    runControls.style.display = "none";
    downloadSection.style.display = "none";
    progressFill.style.width = "0%";
    logBox.innerHTML = "";
    btnExecute.disabled = true;
    done = 0; total = 0; isPaused = false;
  });

  // ── Download final ────────────────────────────────────────────────────────
  btnDownload.addEventListener("click", () => {
    window.location.href = "/download";
  });
</script>
</body>
</html>
