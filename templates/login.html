<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — VOX Preposto RPA</title>
  <style>
    :root {
      --vox-primary:   #be6732;
      --vox-primary-d: #9e5228;
      --vox-ink:       #1e1f1f;
      --vox-mid:       #6f7070;
      --vox-light:     #8b8c8c;
      --vox-deep:      #545c59;
      --bg:            #f5f2ef;
      --border:        #e2ddd8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(30,31,31,.10);
      width: 100%;
      max-width: 380px;
      overflow: hidden;
    }

    .card-header {
      background: var(--vox-ink);
      color: #fff;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-bar { width: 100%; height: 5px; background: var(--vox-primary); }
    .header-inner { padding: 24px 32px 22px; text-align: center; }
    .vox-badge {
      display: block;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--vox-primary);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      line-height: 1;
      margin-bottom: 8px;
    }
    .card-header h1 { font-size: 1rem; font-weight: 600; color: #fff; }
    .card-header p  { font-size: .78rem; color: var(--vox-light); margin-top: 3px; }

    .card-body { padding: 32px; display: flex; flex-direction: column; gap: 16px; }

    label { font-size: .85rem; font-weight: 600; color: var(--vox-ink); display: block; margin-bottom: 5px; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .9rem;
      color: var(--vox-ink);
      transition: border-color .15s;
    }
    input:focus {
      outline: none;
      border-color: var(--vox-primary);
      box-shadow: 0 0 0 3px rgba(190,103,50,.12);
    }

    .error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .85rem;
      color: #b91c1c;
    }

    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: var(--vox-primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { background: var(--vox-primary-d); }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="header-bar"></div>
    <div class="header-inner">
      <span class="vox-badge">vox</span>
      <h1>Preposto RPA</h1>
      <p>Elaw Carrefour — acesso restrito</p>
    </div>
  </div>
  <form class="card-body" method="POST" action="/login">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div>
      <label for="user">Usuário</label>
      <input type="text" id="user" name="user" autocomplete="username" required autofocus />
    </div>
    <div>
      <label for="pass">Senha</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password" required />
    </div>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
